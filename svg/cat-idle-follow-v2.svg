<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" shape-rendering="crispEdges" viewBox="-8 -10 50 50"><defs><style>@keyframes breathe{0%{transform:scale(1,1)}50%{transform:scale(1.015,.985) translate(0,.4px)}}@keyframes tail-sway{0%{transform:rotate(0deg)}35%{transform:rotate(5deg)}75%{transform:rotate(-3deg)}}@keyframes whiskers{0%,90%,94%{transform:scaleX(1)}92%,96%{transform:scaleX(1.06)}}@keyframes ear-twitch-l{0%,88%,92%{transform:rotate(0deg)}90%,94%{transform:rotate(-10deg)}}@keyframes ear-twitch-r{0%,78%,82%{transform:rotate(0deg)}80%,84%{transform:rotate(10deg)}}@keyframes blink{0%{transform:scaleY(1)}50%{transform:scaleY(.08)}}@keyframes purr-eye-close{0%{transform:scaleY(1)}}@keyframes purr-whiskers{0%{transform:translateY(0)}50%{transform:translateY(.6px)}}@keyframes purr-face{0%{transform:translate(var(--purr-face-x),var(--purr-face-y))}50%{transform:translate(var(--purr-face-x),calc(var(--purr-face-y) + .4px))}}@keyframes purr-tail-flutter{0%{transform:rotate(-5deg)}50%{transform:rotate(12deg)}}@keyframes hunting-face-crouch{0%{transform:translateY(0) scale(1)}}@keyframes hunting-body-grow{0%{transform:scale(1)}}@keyframes hunting-body-wiggle{0%{transform:translateX(0)}25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}@keyframes hunting-tail-wiggle{0%{transform:translateX(0)}25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}@keyframes hunting-tail-rise{0%{transform:translateY(0)}}@keyframes hunting-face-return{0%{transform:translateY(11px) scale(1)}}@keyframes hunting-body-return{0%{transform:scale(1.2)}}@keyframes hunting-tail-return{0%{transform:translateY(-5px)}}:root{--cat-color:#1A1A1A;--cat-outline:#FFFFFF;--cat-outline-width:1;--purr-face-x:0px;--purr-face-y:0px}.breathe-anim{transform-origin:16px 22px;animation:breathe 3.5s infinite ease-in-out}.whiskers-flex{transform-origin:16px 16px;animation:whiskers 8s infinite ease-in-out}.eye-l-blink{transform-origin:9px 12.5px}.eye-r-blink{transform-origin:18px 12.5px}.pupil-left,.pupil-right{transform-box:fill-box;transform-origin:center;transition:transform .24s ease-out}.closed-eye-line{opacity:0}#body-js,#eyes-js,#face-js{transition:transform .18s ease-out}</style><filter id="cat-outline" width="140%" height="140%" x="-20%" y="-20%"><feMorphology in="SourceAlpha" operator="dilate" radius="1" result="dilated"/><feFlood flood-color="var(--cat-outline)" result="flood"/><feComposite in="flood" in2="dilated" operator="in" result="outline"/><feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="eye-outline" width="200%" height="200%" x="-50%" y="-50%"><feMorphology in="SourceAlpha" operator="dilate" radius="1" result="dilated"/><feFlood flood-color="#F5F5F5" result="flood"/><feComposite in="flood" in2="dilated" operator="in" result="outline"/><feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="head-clip"><path d="M4 3H2V5H1V7H0V12H1V16H3V17H4V18H6V19H16V18H18V17H19V16H20V15H21V12H22V8H21V5H20V4H19V3H17V2H15V1H7V2H4V3Z" transform="translate(3 4)"/></clipPath><clipPath id="body-clip"><path d="M15 0V1H18V2H20V3H21V6H22V11H21V14H19V15H3V14H1V11H0V6H1V3H2V2H4V1H7V0H15Z" transform="translate(3 19)"/></clipPath><clipPath id="leg-fl-clip"><path d="M6 29V26H7V25H10V26H11V28H12V31H13V32H14V35H13V36H9V35H8V31H7V29H6Z"/></clipPath><clipPath id="leg-fr-clip"><path d="M23 29V26H22V25H19V26H18V28H17V31H16V32H15V35H16V36H20V35H21V31H22V29H23Z"/></clipPath></defs><g id="body-js" filter="url(#cat-outline)"><g class="breathe-anim"><g class="hunting-body-grow"><g id="body" fill="var(--cat-color)" data-patch-frame="3 19 1 1"><path d="M15 0V1H18V2H20V3H21V6H22V11H21V14H19V15H3V14H1V11H0V6H1V3H2V2H4V1H7V0H15Z" transform="translate(3 19)"/></g></g><g id="legs" fill="var(--cat-color)"><g id="leg-fl" data-patch-frame="6 25 1 1"><path d="M6 29V26H7V25H10V26H11V28H12V31H13V32H14V35H13V36H9V35H8V31H7V29H6Z"/></g><g id="leg-fr" data-patch-frame="15 25 1 1"><path d="M23 29V26H22V25H19V26H18V28H17V31H16V32H15V35H16V36H20V35H21V31H22V29H23Z"/></g></g><g id="face-js"><g class="whiskers-flex"><g id="whiskers" fill="var(--cat-color)" data-heat-overlay="true"><rect width="5" height="1" x="0" y="14"/><rect width="5" height="1" x="23" y="14"/><rect width="6" height="1" x="0" y="17"/><rect width="6" height="1" x="23" y="17"/></g></g><g id="head" fill="var(--cat-color)" data-patch-frame="3 5 1 1"><path d="M4 3H2V5H1V7H0V12H1V16H3V17H4V18H6V19H16V18H18V17H19V16H20V15H21V12H22V8H21V5H20V4H19V3H17V2H15V1H7V2H4V3Z" transform="translate(3 4)"/></g><g id="eyes-js"><g class="eye-l-blink"><g id="eye-left"><g fill="var(--eye-bg-color, #FFFFFF)"><rect width="1" height="3" x="7" y="11"/><rect width="1" height="3" x="11" y="11"/><rect width="3" height="5" x="8" y="10"/></g><rect id="pupil-left" width="3" height="3" x="8" y="11" fill="var(--eye-color-left, var(--eye-color, var(--cat-color)))" class="pupil-left"/></g></g><g class="eye-r-blink"><g id="eye-right"><g fill="var(--eye-bg-color, #FFFFFF)"><rect width="1" height="3" x="16" y="11"/><rect width="1" height="3" x="20" y="11"/><rect width="3" height="5" x="17" y="10"/></g><rect id="pupil-right" width="3" height="3" x="17" y="11" fill="var(--eye-color-right, var(--eye-color, var(--cat-color)))" class="pupil-right"/></g></g><rect width="5" height="1" x="7" y="12" fill="var(--cat-outline)" class="closed-eye-line"/><rect width="5" height="1" x="16" y="12" fill="var(--cat-outline)" class="closed-eye-line"/></g></g></g></g></svg>